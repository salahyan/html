<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#02060a"
    >

    <title>JARVIS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="jarvis">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="status-dot"></div>

        <span>JARVIS ONLINE</span>

    </div>


    <!-- =====================================================
         ORB
    ====================================================== -->

    <div class="orb">

        <div class="orb-inner"></div>

    </div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1>JARVIS</h1>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <p id="status">
        Нажмите кнопку и говорите, сэр.
    </p>


    <!-- =====================================================
         CONVERSATION
    ====================================================== -->

    <div
        id="conversation"
        class="conversation"
    >

        <div class="jarvis-message">
            Добро пожаловать, сэр.
        </div>

    </div>


    <!-- =====================================================
         MICROPHONE
    ====================================================== -->

    <button
        id="micButton"
        class="mic-button"
        type="button"
    >
        🎙️
    </button>


    <p class="hint">
        Нажмите для разговора
    </p>


    <!-- =====================================================
         MEMORY BUTTON
    ====================================================== -->

    <button
        id="memoryButton"
        class="memory-button"
        type="button"
    >
        🧠 Память JARVIS
    </button>


</main>


<!-- =========================================================
     MEMORY MODAL
========================================================== -->

<div
    id="memoryModal"
    class="memory-modal"
    aria-hidden="true"
>

    <div class="memory-panel">

        <button
            id="closeMemory"
            class="memory-close"
            type="button"
            aria-label="Закрыть"
        >
            ✕
        </button>


        <div class="memory-icon">
            🧠
        </div>


        <h2>
            Память JARVIS
        </h2>


        <p class="memory-description">
            Здесь можно посмотреть контекст,
            который JARVIS использует для продолжения
            ваших разговоров.
        </p>


        <!-- =================================================
             MEMORY CONTENT
        ================================================== -->

        <div
            id="memoryContent"
            class="memory-content"
        >

            <div class="memory-empty">
                Память загружается...
            </div>

        </div>


        <!-- =================================================
             MEMORY ACTIONS
        ================================================== -->

        <div class="memory-actions">

            <button
                id="refreshMemory"
                type="button"
                class="memory-action"
            >
                🔄 Обновить
            </button>


            <button
                id="clearMemory"
                type="button"
                class="memory-action danger"
            >
                🗑️ Очистить память
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     SCRIPT
========================================================== -->

<script src="script.js"></script>

</body>

</html>
