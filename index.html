<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#02060a"
    >

    <title>JARVIS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="jarvis">

    <div class="header">

        <div class="status-dot"></div>

        <span>JARVIS ONLINE</span>

    </div>

    <div class="orb">

        <div class="orb-inner"></div>

    </div>

    <h1>JARVIS</h1>

    <p id="status">
        Нажмите кнопку и говорите, сэр.
    </p>

    <div
        id="conversation"
        class="conversation"
    >

        <div class="jarvis-message">
            Добро пожаловать, сэр.
        </div>

    </div>

    <button
        id="micButton"
        class="mic-button"
        type="button"
    >
        🎙️
    </button>

    <p class="hint">
        Нажмите для разговора
    </p>

</main>

<script src="script.js"></script>

</body>
</html>
