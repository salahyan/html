<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#02060a">
    <title>JARVIS</title>

    <style>
        /* ============================================================
           CSS СТИЛИ
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #02060a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .jarvis {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(145deg, #0a0f1a, #05080f);
            border-radius: 30px;
            padding: 30px 25px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 180, 255, 0.05);
            border: 1px solid rgba(0, 180, 255, 0.08);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #5a7a9a;
            text-transform: uppercase;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 12px #00e67688;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.9);
            }
        }

        /* ORB */
        .orb {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a3a5a, #0a1a2a);
            box-shadow: 0 0 60px rgba(0, 150, 255, 0.15), inset 0 0 60px rgba(0, 150, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .orb-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4a8ab5, #0a2a4a);
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.2);
            animation: orb-pulse 3s ease-in-out infinite;
        }

        @keyframes orb-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #4a9eff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(0, 150, 255, 0.15);
        }

        /* STATUS */
        #status {
            font-size: 15px;
            color: #7a9ab5;
            margin-bottom: 18px;
            min-height: 28px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* CONVERSATION */
        .conversation {
            background: rgba(10, 20, 35, 0.6);
            border-radius: 16px;
            padding: 18px 20px;
            min-height: 120px;
            max-height: 320px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: left;
            font-size: 15px;
            line-height: 1.6;
            border: 1px solid rgba(0, 180, 255, 0.06);
            scroll-behavior: smooth;
        }

        .conversation::-webkit-scrollbar {
            width: 4px;
        }

        .conversation::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversation::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 10px;
        }

        .user-message {
            color: #7ab8e0;
            margin-bottom: 12px;
            padding: 8px 14px;
            background: rgba(0, 100, 200, 0.08);
            border-radius: 12px 12px 12px 4px;
            border-left: 3px solid #4a9eff;
        }

        .user-message strong {
            color: #4a9eff;
        }

        .jarvis-message {
            color: #b0d0e8;
            margin-bottom: 12px;
            padding: 8px 14px;
            background: rgba(0, 200, 255, 0.04);
            border-radius: 12px 12px 4px 12px;
            border-right: 3px solid #00d4ff;
        }

        .jarvis-message strong {
            color: #00d4ff;
        }

        /* MICROPHONE */
        .mic-button {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #0a2a4a, #1a4a7a);
            color: #7ab8e0;
            font-size: 34px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 100, 200, 0.2);
            margin-bottom: 12px;
            position: relative;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 40px rgba(0, 150, 255, 0.3);
        }

        .mic-button:active {
            transform: scale(0.92);
        }

        .mic-button.listening {
            background: linear-gradient(135deg, #1a4a7a, #4a9eff);
            color: #fff;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.4);
            animation: mic-pulse 1.2s infinite;
        }

        @keyframes mic-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(0, 150, 255, 0.6);
            }
        }

        .hint {
            font-size: 13px;
            color: #3a5a7a;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        /* MEMORY BUTTON */
        .memory-button {
            background: rgba(0, 100, 200, 0.1);
            color: #5a8aaa;
            border: 1px solid rgba(0, 180, 255, 0.15);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .memory-button:hover {
            background: rgba(0, 100, 200, 0.2);
            color: #8ac0e0;
            border-color: rgba(0, 180, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 100, 200, 0.15);
        }

        .memory-button:active {
            transform: scale(0.95);
        }

        /* ============================================================
           МОДАЛЬНОЕ ОКНО ПАМЯТИ
           ============================================================ */

        .memory-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .memory-modal[aria-hidden="false"] {
            display: flex !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .memory-panel {
            background: linear-gradient(145deg, #0a1a2a, #050a12);
            border-radius: 24px;
            padding: 28px 30px 30px;
            max-width: 520px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(0, 180, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 100, 200, 0.05);
            position: relative;
        }

        .memory-panel::-webkit-scrollbar {
            width: 4px;
        }

        .memory-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .memory-panel::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 10px;
        }

        .memory-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: #5a7a9a;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .memory-close:hover {
            color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .memory-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 6px;
        }

        .memory-panel h2 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #4a9eff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .memory-description {
            text-align: center;
            color: #5a7a9a;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .memory-content {
            background: rgba(10, 20, 35, 0.5);
            border-radius: 14px;
            padding: 16px 18px;
            min-height: 100px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 18px;
            border: 1px solid rgba(0, 180, 255, 0.05);
            text-align: left;
            font-size: 14px;
            line-height: 1.7;
        }

        .memory-content::-webkit-scrollbar {
            width: 4px;
        }

        .memory-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .memory-content::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 10px;
        }

        .memory-section {
            margin-bottom: 16px;
        }

        .memory-section-title {
            color: #4a9eff;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.08);
        }

        .memory-item {
            padding: 4px 0 4px 8px;
            color: #b0c8d8;
            font-size: 13px;
            border-left: 2px solid rgba(0, 180, 255, 0.08);
            margin-bottom: 2px;
        }

        .memory-item.user {
            border-left-color: #4a9eff;
            color: #7ab8e0;
        }

        .memory-item.assistant {
            border-left-color: #00d4ff;
            color: #b0d0e8;
        }

        .memory-empty {
            color: #4a6a8a;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        .memory-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .memory-action {
            background: rgba(0, 100, 200, 0.1);
            color: #5a8aaa;
            border: 1px solid rgba(0, 180, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .memory-action:hover {
            background: rgba(0, 100, 200, 0.2);
            color: #8ac0e0;
            border-color: rgba(0, 180, 255, 0.25);
            transform: translateY(-1px);
        }

        .memory-action.danger:hover {
            background: rgba(233, 69, 96, 0.15);
            color: #e94560;
            border-color: rgba(233, 69, 96, 0.2);
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */

        @media (max-width: 500px) {
            .jarvis {
                padding: 20px 16px 25px;
                border-radius: 20px;
            }

            .orb {
                width: 90px;
                height: 90px;
            }

            .orb-inner {
                width: 45px;
                height: 45px;
            }

            h1 {
                font-size: 26px;
            }

            .mic-button {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .memory-panel {
                padding: 20px 16px 22px;
                border-radius: 18px;
                margin: 10px;
            }

            .memory-content {
                max-height: 250px;
                font-size: 13px;
                padding: 12px 14px;
            }
        }

        @media (max-width: 380px) {
            .jarvis {
                padding: 14px 12px 18px;
            }

            .memory-actions {
                flex-direction: column;
                align-items: center;
            }

            .memory-action {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <main class="jarvis">

        <!-- HEADER -->
        <div class="header">
            <div class="status-dot"></div>
            <span>JARVIS ONLINE</span>
        </div>

        <!-- ORB -->
        <div class="orb">
            <div class="orb-inner"></div>
        </div>

        <h1>JARVIS</h1>

        <!-- STATUS -->
        <p id="status">
            Нажмите кнопку и говорите, сэр.
        </p>

        <!-- CONVERSATION -->
        <div id="conversation" class="conversation">
            <div class="jarvis-message">
                Добро пожаловать, сэр.
            </div>
        </div>

        <!-- MICROPHONE -->
        <button id="micButton" class="mic-button" type="button">
            🎙️
        </button>

        <p class="hint">
            Нажмите для разговора
        </p>

        <!-- MEMORY -->
        <button id="memoryButton" class="memory-button" type="button">
            🧠 Память
        </button>

    </main>

    <!-- =========================================================
         MEMORY MODAL WINDOW
    ========================================================== -->

    <div id="memoryModal" class="memory-modal" aria-hidden="true">

        <div class="memory-panel">

            <button id="closeMemory" class="memory-close" type="button">
                ✕
            </button>

            <div class="memory-icon">
                🧠
            </div>

            <h2>
                Память JARVIS
            </h2>

            <p class="memory-description">
                Контекст текущего общения JARVIS.
            </p>

            <div id="memoryContent" class="memory-content">

                <div class="memory-empty">
                    Память пока пуста.
                </div>

            </div>

            <div class="memory-actions">

                <button id="refreshMemory" class="memory-action" type="button">
                    🔄 Обновить
                </button>

                <button id="clearMemory" class="memory-action danger" type="button">
                    🗑️ Очистить
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
