<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#02060a">
    <title>JARVIS</title>

    <style>
        /* ============================================================
           CSS СТИЛИ — Стиль JARVIS
           ============================================================ */

        /* --- БАЗА --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #02060a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* --- ОСНОВНОЙ КОНТЕЙНЕР --- */
        .jarvis {
            max-width: 560px;
            width: 100%;
            background: linear-gradient(160deg, #0a121f, #050a12);
            border-radius: 32px;
            padding: 28px 24px 30px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.95), 0 0 60px rgba(0, 150, 255, 0.04);
            border: 1px solid rgba(0, 180, 255, 0.06);
            position: relative;
            transition: all 0.3s ease;
        }

        /* --- ШАПКА --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: #4a7a9a;
            text-transform: uppercase;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 14px #00e67688;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge {
            font-size: 10px;
            background: rgba(0, 180, 255, 0.08);
            padding: 4px 12px;
            border-radius: 20px;
            color: #3a8aaa;
            border: 1px solid rgba(0, 180, 255, 0.06);
        }

        /* --- ORB --- */
        .orb-container {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .orb {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a3a5a, #0a1a2a);
            box-shadow: 0 0 60px rgba(0, 150, 255, 0.12), inset 0 0 60px rgba(0, 150, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .orb-inner {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4a8ab5, #0a2a4a);
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.15);
            animation: orb-pulse 3s ease-in-out infinite;
        }

        @keyframes orb-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        /* --- ЗАГОЛОВОК --- */
        .title {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #4a9eff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            text-shadow: 0 0 40px rgba(0, 150, 255, 0.1);
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #3a5a7a;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        /* --- СТАТУС --- */
        #status {
            font-size: 14px;
            color: #5a8aaa;
            text-align: center;
            min-height: 26px;
            font-weight: 400;
            letter-spacing: 0.2px;
            margin-bottom: 14px;
        }

        /* --- ВКЛАДКИ --- */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: rgba(0, 20, 40, 0.4);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid rgba(0, 180, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: #4a7a9a;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: #7ab8e0;
            background: rgba(0, 100, 200, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 100, 200, 0.2), rgba(0, 180, 255, 0.1));
            color: #8ac8e8;
            box-shadow: 0 2px 20px rgba(0, 100, 200, 0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* --- ЧАТ --- */
        .conversation {
            background: rgba(10, 20, 35, 0.5);
            border-radius: 16px;
            padding: 16px 18px;
            min-height: 140px;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 14px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid rgba(0, 180, 255, 0.05);
            scroll-behavior: smooth;
        }

        .conversation::-webkit-scrollbar {
            width: 4px;
        }
        .conversation::-webkit-scrollbar-track {
            background: transparent;
        }
        .conversation::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 10px;
        }

        .user-message {
            color: #7ab8e0;
            margin-bottom: 10px;
            padding: 8px 14px;
            background: rgba(0, 100, 200, 0.06);
            border-radius: 12px 12px 12px 4px;
            border-left: 3px solid #4a9eff;
        }

        .user-message strong {
            color: #4a9eff;
        }

        .jarvis-message {
            color: #b0d0e8;
            margin-bottom: 10px;
            padding: 8px 14px;
            background: rgba(0, 200, 255, 0.03);
            border-radius: 12px 12px 4px 12px;
            border-right: 3px solid #00d4ff;
        }

        .jarvis-message strong {
            color: #00d4ff;
        }

        /* --- ТЕКСТОВЫЙ ВВОД --- */
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-row input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(0, 180, 255, 0.08);
            background: rgba(10, 20, 40, 0.6);
            color: #c8d8e8;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-row input[type="text"]:focus {
            border-color: rgba(0, 180, 255, 0.25);
            background: rgba(10, 20, 40, 0.8);
            box-shadow: 0 0 30px rgba(0, 100, 200, 0.03);
        }

        .input-row input[type="text"]::placeholder {
            color: #3a5a7a;
        }

        .input-row .send-btn {
            padding: 12px 20px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #0a2a4a, #1a4a7a);
            color: #7ab8e0;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 50px;
        }

        .input-row .send-btn:hover {
            background: linear-gradient(135deg, #1a3a5a, #2a5a8a);
            box-shadow: 0 4px 30px rgba(0, 100, 200, 0.15);
            transform: scale(1.02);
        }

        .input-row .send-btn:active {
            transform: scale(0.95);
        }

        /* --- ФОТО ЗАГРУЗКА --- */
        .photo-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .photo-row .file-input-wrap {
            flex: 1;
            position: relative;
            min-width: 120px;
        }

        .photo-row .file-input-wrap input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        .photo-row .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px dashed rgba(0, 180, 255, 0.15);
            background: rgba(10, 20, 40, 0.4);
            color: #5a8aaa;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .photo-row .file-label:hover {
            border-color: rgba(0, 180, 255, 0.3);
            background: rgba(10, 20, 40, 0.6);
            color: #8ac0e0;
        }

        .photo-row .file-label.has-file {
            border-color: #4a9eff;
            background: rgba(0, 100, 200, 0.08);
            color: #7ab8e0;
        }

        .photo-preview {
            max-width: 100%;
            max-height: 120px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: none;
            border: 1px solid rgba(0, 180, 255, 0.08);
        }

        .photo-preview.show {
            display: block;
        }

        /* --- МИКРОФОН (ГОЛОСОВОЙ РЕЖИМ) --- */
        .mic-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .mic-button {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #0a2a4a, #1a4a7a);
            color: #7ab8e0;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 100, 200, 0.15);
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 40px rgba(0, 150, 255, 0.25);
        }

        .mic-button:active {
            transform: scale(0.92);
        }

        .mic-button.listening {
            background: linear-gradient(135deg, #1a4a7a, #4a9eff);
            color: #fff;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.35);
            animation: mic-pulse 1.2s infinite;
        }

        @keyframes mic-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(0, 150, 255, 0.25);
            }
            50% {
                box-shadow: 0 0 60px rgba(0, 150, 255, 0.5);
            }
        }

        .hint {
            font-size: 12px;
            color: #3a5a7a;
            letter-spacing: 0.3px;
        }

        /* --- КНОПКА ПАМЯТИ --- */
        .bottom-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .memory-button {
            background: rgba(0, 100, 200, 0.06);
            color: #4a7a9a;
            border: 1px solid rgba(0, 180, 255, 0.06);
            padding: 8px 20px;
            border-radius: 22px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .memory-button:hover {
            background: rgba(0, 100, 200, 0.12);
            color: #7ab8e0;
            border-color: rgba(0, 180, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 100, 200, 0.08);
        }

        .memory-button:active {
            transform: scale(0.95);
        }

        /* ============================================================
           МОДАЛЬНОЕ ОКНО ПАМЯТИ
           ============================================================ */

        .memory-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
            padding: 20px;
        }

        .memory-modal[aria-hidden="false"] {
            display: flex !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .memory-panel {
            background: linear-gradient(145deg, #0a1a2a, #050a12);
            border-radius: 24px;
            padding: 26px 28px 28px;
            max-width: 520px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(0, 180, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .memory-panel::-webkit-scrollbar {
            width: 4px;
        }
        .memory-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .memory-panel::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 10px;
        }

        .memory-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: #4a7a9a;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .memory-close:hover {
            color: #e94560;
            background: rgba(233, 69, 96, 0.08);
        }

        .memory-icon {
            font-size: 36px;
            text-align: center;
            margin-bottom: 4px;
        }

        .memory-panel h2 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #4a9eff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }

        .memory-description {
            text-align: center;
            color: #4a6a8a;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .memory-content {
            background: rgba(10, 20, 35, 0.4);
            border-radius: 14px;
            padding: 14px 16px;
            min-height: 80px;
            max-height: 320px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 180, 255, 0.04);
            text-align: left;
            font-size: 13px;
            line-height: 1.7;
        }

        .memory-content::-webkit-scrollbar {
            width: 4px;
        }
        .memory-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .memory-content::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 10px;
        }

        .memory-section {
            margin-bottom: 14px;
        }

        .memory-section-title {
            color: #4a9eff;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.06);
        }

        .memory-item {
            padding: 3px 0 3px 8px;
            color: #b0c8d8;
            font-size: 13px;
            border-left: 2px solid rgba(0, 180, 255, 0.06);
            margin-bottom: 2px;
        }

        .memory-item.user {
            border-left-color: #4a9eff;
            color: #7ab8e0;
        }

        .memory-item.assistant {
            border-left-color: #00d4ff;
            color: #b0d0e8;
        }

        .memory-empty {
            color: #3a5a7a;
            text-align: center;
            padding: 16px 0;
            font-style: italic;
        }

        .memory-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .memory-action {
            background: rgba(0, 100, 200, 0.06);
            color: #4a7a9a;
            border: 1px solid rgba(0, 180, 255, 0.06);
            padding: 7px 18px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .memory-action:hover {
            background: rgba(0, 100, 200, 0.12);
            color: #7ab8e0;
            border-color: rgba(0, 180, 255, 0.12);
        }

        .memory-action.danger:hover {
            background: rgba(233, 69, 96, 0.1);
            color: #e94560;
            border-color: rgba(233, 69, 96, 0.12);
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */

        @media (max-width: 500px) {
            .jarvis {
                padding: 18px 14px 20px;
                border-radius: 24px;
            }

            .orb {
                width: 80px;
                height: 80px;
            }
            .orb-inner {
                width: 40px;
                height: 40px;
            }

            .title {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .mic-button {
                width: 56px;
                height: 56px;
                font-size: 26px;
            }

            .memory-panel {
                padding: 18px 14px 20px;
                border-radius: 18px;
            }

            .memory-content {
                max-height: 200px;
                font-size: 12px;
                padding: 10px 12px;
            }

            .conversation {
                max-height: 200px;
                font-size: 13px;
                padding: 12px 14px;
            }

            .tab-btn {
                font-size: 11px;
                padding: 6px 8px;
            }

            .photo-row .file-label {
                font-size: 12px;
                padding: 8px 12px;
            }

            .input-row input[type="text"] {
                font-size: 13px;
                padding: 10px 12px;
            }

            .input-row .send-btn {
                font-size: 16px;
                padding: 10px 14px;
                min-width: 44px;
            }
        }

        @media (max-width: 380px) {
            .jarvis {
                padding: 12px 10px 16px;
            }

            .header {
                font-size: 11px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                flex: 1 1 45%;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="jarvis">

        <!-- =========================================================
             HEADER
        ========================================================== -->
        <div class="header">
            <div class="header-left">
                <div class="status-dot"></div>
                <span>JARVIS</span>
            </div>
            <div class="header-right">
                <span class="header-badge">v2.0</span>
            </div>
        </div>

        <!-- =========================================================
             ORB
        ========================================================== -->
        <div class="orb-container">
            <div class="orb">
                <div class="orb-inner"></div>
            </div>
        </div>

        <div class="title">JARVIS</div>
        <div class="subtitle">персональный AI-помощник</div>

        <!-- =========================================================
             СТАТУС
        ========================================================== -->
        <p id="status">Нажмите кнопку и говорите, сэр.</p>

        <!-- =========================================================
             ВКЛАДКИ
        ========================================================== -->
        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="voice">🎙️ Голосовой</button>
            <button class="tab-btn" data-tab="text">💬 Текстовый</button>
            <button class="tab-btn" data-tab="photo">📷 Фото</button>
        </div>

        <!-- =========================================================
             ВКЛАДКА: ГОЛОСОВОЙ ЧАТ
        ========================================================== -->
        <div class="tab-content active" id="tab-voice">
            <div id="conversation" class="conversation">
                <div class="jarvis-message">Добро пожаловать, сэр.</div>
            </div>

            <div class="mic-area">
                <button id="micButton" class="mic-button" type="button">🎙️</button>
                <p class="hint">Нажмите для разговора</p>
            </div>
        </div>

        <!-- =========================================================
             ВКЛАДКА: ТЕКСТОВЫЙ ЧАТ
        ========================================================== -->
        <div class="tab-content" id="tab-text">
            <div id="textConversation" class="conversation">
                <div class="jarvis-message">Напишите мне что-нибудь, сэр.</div>
            </div>

            <div class="input-row">
                <input type="text" id="textInput" placeholder="Введите сообщение..." autocomplete="off">
                <button class="send-btn" id="sendTextBtn">➤</button>
            </div>
        </div>

        <!-- =========================================================
             ВКЛАДКА: ФОТО
        ========================================================== -->
        <div class="tab-content" id="tab-photo">
            <div id="photoConversation" class="conversation">
                <div class="jarvis-message">Загрузите фото для анализа, сэр.</div>
            </div>

            <img id="photoPreview" class="photo-preview" alt="Превью фото">

            <div class="photo-row">
                <div class="file-input-wrap">
                    <input type="file" id="photoInput" accept="image/*">
                    <span class="file-label" id="photoLabel">📎 Выбрать фото</span>
                </div>
                <button class="send-btn" id="analyzePhotoBtn" style="padding:10px 18px;font-size:14px;">🔍 Анализировать</button>
            </div>

            <div class="input-row" style="margin-bottom:0;">
                <input type="text" id="photoQuestion" placeholder="Вопрос к фото (например: что тут написано?)" autocomplete="off">
            </div>
        </div>

        <!-- =========================================================
             КНОПКА ПАМЯТИ
        ========================================================== -->
        <div class="bottom-row">
            <button id="memoryButton" class="memory-button" type="button">🧠 Память</button>
        </div>

    </main>

    <!-- =========================================================
         МОДАЛЬНОЕ ОКНО ПАМЯТИ
    ========================================================== -->
    <div id="memoryModal" class="memory-modal" aria-hidden="true">
        <div class="memory-panel">
            <button id="closeMemory" class="memory-close" type="button">✕</button>
            <div class="memory-icon">🧠</div>
            <h2>Память JARVIS</h2>
            <p class="memory-description">Контекст текущего общения</p>
            <div id="memoryContent" class="memory-content">
                <div class="memory-empty">Память пока пуста.</div>
            </div>
            <div class="memory-actions">
