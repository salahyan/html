<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#02060a"
    >

    <title>JARVIS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="jarvis">

    <!-- HEADER -->

    <div class="header">

        <div class="status-dot"></div>

        <span>JARVIS ONLINE</span>

    </div>


    <!-- ORB -->

    <div class="orb">

        <div class="orb-inner"></div>

    </div>


    <h1>JARVIS</h1>


    <!-- STATUS -->

    <p id="status">
        Нажмите кнопку и говорите, сэр.
    </p>


    <!-- CONVERSATION -->

    <div
        id="conversation"
        class="conversation"
    >

        <div class="jarvis-message">
            Добро пожаловать, сэр.
        </div>

    </div>


    <!-- MICROPHONE -->

    <button
        id="micButton"
        class="mic-button"
        type="button"
    >
        🎙️
    </button>


    <p class="hint">
        Нажмите для разговора
    </p>


    <!-- MEMORY -->

<!-- MEMORY -->
<button
    id="memoryButton"
    class="memory-button"
    type="button"
>
    🧠 Память
</button>

</main>


<!-- =========================================================
     MEMORY WINDOW
========================================================== -->

<div
    id="memoryModal"
    class="memory-modal"
    aria-hidden="true"
>

    <div class="memory-panel">

        <button
            id="closeMemory"
            class="memory-close"
            type="button"
        >
            ✕
        </button>


        <div class="memory-icon">
            🧠
        </div>


        <h2>
            Память JARVIS
        </h2>


        <p class="memory-description">
            Контекст текущего общения JARVIS.
        </p>


        <div
            id="memoryContent"
            class="memory-content"
        >

            <div class="memory-empty">
                Память пока пуста.
            </div>

        </div>


        <div class="memory-actions">

            <button
                id="refreshMemory"
                class="memory-action"
                type="button"
            >
                🔄 Обновить
            </button>


            <button
                id="clearMemory"
                class="memory-action danger"
                type="button"
            >
                🗑️ Очистить
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
